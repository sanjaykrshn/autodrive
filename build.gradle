plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}
repositories { mavenCentral() }
loom {
    splitEnvironmentSourceSets()
    mods {
        "autodrive" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}
dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    testImplementation platform('org.junit:junit-bom:5.14.1')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
processResources {
    def modVersion = project.version
    inputs.property 'version', modVersion
    filesMatching('fabric.mod.json') { expand 'version': modVersion }
}
tasks.withType(JavaCompile).configureEach { options.release = 25 }
test { useJUnitPlatform() }
java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}
jar {
    from('LICENSE') { rename { "${it}_autodrive" } }
}
publishing {
    publications { mavenJava(MavenPublication) { from components.java } }
}

fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'autodrive-test'
        enableGameTests = true
        enableClientGameTests = true
    }
}
loom.runs.gameTest {
    vmArg '-Dfabric-api.gametest.report-file=../../test-results/gametest.xml'
}
